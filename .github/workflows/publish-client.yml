name: Publish MiaoMiao client LPK
on:
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Optional successful private component build run ID
        type: string
        default: ''
      dry-run:
        description: Verify only; skip Release and store submissions
        type: boolean
        default: true
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    uses: ./.github/workflows/publish-lpk.yml
    with:
      component: client
      source-run-id: ${{ inputs.source-run-id }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
    secrets:
      LPK_SOURCE_REPOSITORY: ${{ secrets.LPK_SOURCE_REPOSITORY }}
      SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      APP_ID: ${{ secrets.CLIENT_APP_ID }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.CLIENT_PRIVATE_STORE_GROUP_CODES }}
      LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
